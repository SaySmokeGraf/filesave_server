<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Панель модератора</title>
  <link rel="stylesheet" href="moderator.css" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
</head>

<body>
  <div class="moderator_header">
    <div class="moderator-panel">
      <div class="admin_profile">

        <div class="pair" id="username_pair">
          <label id="username_label">username:</label>
          <label id="username_field_label">Admin</label>
        </div>
        <div class="pair" id="status_pair">
          <label id="status_label">status:</label>
          <label id="status_field_label">Administrator</label>
        </div>
        <!-- <div class="exitFromModerPanel"> -->
        <button type="button" class="exit_From_Moder_Btn">Выйти</button>
        <!-- <i class="fa fa-user-plus" aria-hidden="true"></i> -->
        </button>
        <!-- </div> -->

      </div>

    </div>

    <div class="search_panel">
      <form class="search_form">
        <!-- Текстовое поле -->
        <input type="text" class="search_form_input" placeholder="Искать пользователя здесь..." />

        <!-- Встроенный фильтр (теперь стоит перед кнопкой отправки) -->
        <button type="button" class="search_form_filter_btn" id="filterBtn" title="Фильтры">
          <i class="fa fa-sliders" aria-hidden="true"></i>
        </button>
        <div class="filter-row-container" id="filterDropdown">
          <div class="filter-item">
            <!-- <label><input type="checkbox" name="filter_banned"> забанен</label> -->
            <label>Статус бана:
              <select name="filter_banned">
                <option value="">Все равно (ничего)</option> <!-- Это и есть null / пустота -->
                <option value="true">Забанен</option>
                <option value="false">Не забанен</option>
              </select>
            </label>
          </div>
          <div class="filter-item">
            <label>Статус верификации:
              <select name="filter_verified">
                <option value="">Все равно (ничего)</option> <!-- Это и есть null / пустота -->
                <option value="true">верифицирован</option>
                <option value="false">неверифицирован</option>
              </select>
            </label>
          </div>
          <div class="filter-item">
            <label>Статус модератора:
              <select name="filter_is_moderator">
                <option value="">Все равно (ничего)</option> <!-- Это и есть null / пустота -->
                <option value="true">модератор </option>
                <option value="false">не модератор</option>
              </select>
            </label>
          </div>
          <div class="filter-item">
            <label>Пользователей на странице:
              <!-- Заменили select на input с типом number -->
              <input type="number" name="filter_limit" placeholder="10" min="1" max="100" class="filter_limit_input" />
            </label>
          </div>

          <button type="button" class="reset">Сброс</button>



        </div>
        <button type="submit" class="search_form_button"></button>

    </div>
    <!-- Кнопка отправки -->

    </form>

  </div>
  </div>

  <!-- <button type="button" class="new_user_button">
      <i class="fa fa-user-plus" aria-hidden="true"></i>
    </button> -->
  </div>

  <div class="user_list">
    <table class="moderator_table" id="moderator_table">
      <thead>
        <tr>
          <th>Пользователь</th>
          <th>Верифицирован</th>
          <th>Забанен</th>
          <th>Модератор</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <div class="pagination-container">
    <div class="pagination-info">
      Страница <span id="current-page">5</span> из <span id="total-pages">10</span> (<span id="total-users">100</span>
      пользователей всего)
    </div>
    <div class="pagination-controls">
      <button id="prev-page" class="pagination-btn">← Назад</button>
      <span id="page-numbers">
        <button class="page-link">1</button>
        <span class="ellipsis">...</span>
        <button class="page-link">3</button>
        <button class="page-link">4</button>
        <button class="page-link active">5</button>
        <button class="page-link">6</button>
        <button class="page-link">7</button>
        <span class="ellipsis">...</span>
        <button class="page-link">10</button>
      </span>
      <button id="next-page" class="pagination-btn">Вперёд →</button>
    </div>
  </div>

  <script src="cookies.js"></script>
  <script src="request.js"></script>
  <script src="profile.js"></script>
  <script src="pagination.js"></script>
  <script src="moderator.js"></script>
</body>
<footer>

</footer>

</html>
